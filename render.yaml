# MAGIC on Render.
#
# One image, one service, four processes. `infra/start-all.mjs` starts the console, the API, the
# webhook endpoint and the worker together, and takes the container down if any of them stops.
#
# This is a proof-of-concept shape, not the architecture. The four are separate deployables
# because a webhook flood must not stall the console and a worker must not compete with request
# handling, and none of that stops being true here — it is simply not being paid for yet.
# Splitting them back out is a change to this file: give each its own service block with the same
# image and a different `dockerCommand`. No application code changes.
#
# What the shape costs, stated plainly:
#
#   * The webhook endpoint is not reachable from Stripe. Only the console is bound to a public
#     interface; the API and ingest listen on loopback inside the container. That is survivable
#     while STRIPE_ENABLED is false and the data is seeded, and it is the first thing to fix when
#     it is not.
#   * Any process exiting restarts all of them.
#   * Nothing scales independently.
#
# Two things here are load-bearing and easy to undo by accident:
#
#   1. The service connects as `magic_app`, never as the database's own connection string. That
#      string belongs to the schema owner, and an owner is not meaningfully constrained by the
#      least-privilege grants the schema relies on. The owner URL is given to exactly one place —
#      the pre-deploy migration step.
#   2. `MAGIC_APP_PASSWORD` is generated by Render and read by migration 0006, which creates and
#      rotates the application role with it. It is never a literal in the repository.

databases:
  - name: magic-postgres
    databaseName: magic
    user: magic_owner
    plan: 0.1c-256mb
    postgresMajorVersion: '17'
    ipAllowList: []

services:
  # BullMQ must never have a job evicted under memory pressure: a dropped job is a reconciliation
  # that silently never runs. `noeviction` makes the queue fail loudly instead.
  - type: keyvalue
    name: magic-keyvalue
    plan: 256mb
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: magic
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    dockerCommand: node infra/start-all.mjs
    healthCheckPath: /sign-in
    # Runs before the new instance starts, and is the one place the owner connection string is
    # used. The migrator is idempotent — it records applied files and skips them — but it takes no
    # advisory lock, which is why it belongs here rather than in the start command, where four
    # processes would race to run it.
    preDeployCommand: node packages/db/dist/cli/migrate.js
    envVars:
      - key: NODE_ENV
        value: production

      # The console is the only process on a public interface. Render discovers a service's port
      # by finding an open one, so the other three bind to loopback: otherwise the public URL
      # could land on the API or the webhook endpoint instead.
      - key: PORT
        value: '10000'
      - key: API_PORT
        value: '4000'
      - key: API_HOST
        value: 127.0.0.1
      - key: INGEST_PORT
        value: '4001'
      - key: INGEST_HOST
        value: 127.0.0.1
      - key: WORKER_METRICS_PORT
        value: '4002'
      - key: WORKER_METRICS_HOST
        value: 127.0.0.1

      # Same container, so the console reaches the API over loopback. The scheme matters: the
      # console builds request URLs by concatenation and a bare host:port fails to parse.
      - key: API_INTERNAL_URL
        value: http://127.0.0.1:4000

      - key: WORKER_ROLE
        value: all

      # Read by migration 0006, which creates the application role with it on the first deploy and
      # rotates it on any later one. Generated by Render, so it exists nowhere in the repository.
      - key: MAGIC_APP_PASSWORD
        generateValue: true
      # Used only by the pre-deploy migration step above.
      - key: DATABASE_URL_OWNER
        fromDatabase: { name: magic-postgres, property: connectionString }
      # The application connection, set by hand once after the first deploy — see
      # `infra/render.md`. Render cannot compose a URL from parts.
      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService: { type: keyvalue, name: magic-keyvalue, property: connectionString }
      - key: SERVICE_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

      # Exports do work in this shape, which they would not across separate services: the worker
      # writes the file and the console reads it from the same container filesystem. There is no
      # disk behind it, so a generated file does not survive a restart — acceptable against a
      # fifteen-minute download window, and the reason this must stay a single instance. It also
      # means a missing file really is an expired one, which is what this flag reports.
      - key: EXPORT_STORAGE_SHARED
        value: 'true'

      - key: SECRETS_PROVIDER
        value: env
      - key: STRIPE_API_VERSION
        value: '2026-06-30'
      # Off until real credentials exist. With it off the fleet runs against seeded data and never
      # calls Stripe, which is what makes a credential-free deployment possible — and what makes
      # the unreachable webhook endpoint tolerable.
      - key: STRIPE_ENABLED
        value: 'false'
