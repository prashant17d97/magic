name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  DATABASE_URL: postgres://magic_app:magic_app_password@localhost:5432/magic
  DATABASE_URL_OWNER: postgres://magic_owner:magic_owner_password@localhost:5432/magic
  REDIS_URL: redis://localhost:6379
  SERVICE_TOKEN: ci_service_token_0123456789abcdef
  SESSION_SECRET: ci_session_secret_0123456789abcdef0123456789abcdef0123456789ab

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: magic_owner
          POSTGRES_PASSWORD: magic_owner_password
          POSTGRES_DB: magic
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U magic_owner -d magic"
          --health-interval 5s --health-timeout 3s --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' build
      - run: pnpm db:migrate
      - run: pnpm -r typecheck
      - run: pnpm lint

      # The blocking gates. Each one encodes a claim the product makes, and a claim that is not
      # tested on every commit eventually stops being true.
      - name: Cross-tenant isolation
        run: pnpm --filter @magic/db test
      - name: Webhook signature and replay rejection
        run: pnpm --filter @magic/ingest test
      - name: Fixture corpus produces the expected exception sets
        run: pnpm --filter @magic/fixtures exec vitest run src/corpus.test.ts
      - name: Reconciliation determinism
        run: pnpm test:determinism
      - name: Ingestion chaos leaves zero drift
        run: pnpm test:chaos

      - run: pnpm test

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
